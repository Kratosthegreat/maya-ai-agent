<title>קריירה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Karantina:wght@700&display=swap">
<style>
/* ==========================================================================
   קריירה — עיצוב "משחק לילה": מגרש חשוך, זרקור ענבר, טיפוגרפיה של תוכנייה.
   ========================================================================== */

:root {
  /* בהיר — נייר של תוכניית משחק */
  --bg: #F1F3ED;
  --surface: #FFFFFF;
  --surface-2: #E6EAE0;
  --ink: #12211A;
  --ink-soft: #56675D;
  --line: #D3D9CD;
  --accent: #A66F05;
  --accent-fill: #F0B429;
  --accent-ink: #241803;
  --win: #1E7A4E;
  --draw: #6B7A71;
  --loss: #B3392F;
  --shadow: 0 1px 2px rgba(18, 33, 26, .08), 0 8px 24px rgba(18, 33, 26, .06);
  --radius: 4px;
  --pitch: #DDE4D6;
  --pitch-turf: #CBD8C2;
  --pitch-stripe: #C0CFB6;
  --pitch-line: #F4F7F1;
  --scene-sky: #E4E9DC;
  --scene-far: #D3DBC9;
  --scene-mid: #BEC9B3;
  --scene-near: #A2B199;
  --scene-line: #71805F;
}

:root:not([data-theme="light"]) {
  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B120E;
    --surface: #131E17;
    --surface-2: #1B291F;
    --ink: #E9EFE6;
    --ink-soft: #93A398;
    --line: #26382C;
    --accent: #F0B429;
    --accent-fill: #F0B429;
    --accent-ink: #1A1206;
    --win: #4CAF7D;
    --draw: #8A9A90;
    --loss: #E06B60;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .35);
    --pitch: #16241B;
    --pitch-turf: #16301F;
    --pitch-stripe: #1A3724;
    --pitch-line: #3E6B4C;
    --scene-sky: #0E1712;
    --scene-far: #14201A;
    --scene-mid: #1C2E23;
    --scene-near: #27412F;
    --scene-line: #4C6B55;
  }
}

:root[data-theme="dark"] {
  --bg: #0B120E;
  --surface: #131E17;
  --surface-2: #1B291F;
  --ink: #E9EFE6;
  --ink-soft: #93A398;
  --line: #26382C;
  --accent: #F0B429;
  --accent-fill: #F0B429;
  --accent-ink: #1A1206;
  --win: #4CAF7D;
  --draw: #8A9A90;
  --loss: #E06B60;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .35);
  --pitch: #16241B;
    --pitch-turf: #16301F;
    --pitch-stripe: #1A3724;
    --pitch-line: #3E6B4C;
    --scene-sky: #0E1712;
    --scene-far: #14201A;
    --scene-mid: #1C2E23;
    --scene-near: #27412F;
    --scene-line: #4C6B55;
}

* { box-sizing: border-box; }

body {
  direction: rtl;
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Assistant", "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size: 16px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
}

h1, h2, h3 { margin: 0; text-wrap: balance; }

.display {
  font-family: "Karantina", "Assistant", system-ui, sans-serif;
  font-weight: 700;
  letter-spacing: .01em;
  line-height: .95;
}

button { font-family: inherit; font-size: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-fill); outline-offset: 2px; }

/* ---------- מבנה ---------- */

#app {
  max-width: 560px;
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom);
}

.screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 14px 14px 24px;
}

@media (prefers-reduced-motion: no-preference) {
  .screen { animation: rise .18s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
}

/* ---------- רצועת הסטטוס ---------- */

.strip {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--pitch);
  border-bottom: 1px solid var(--line);
  padding: 9px 14px;
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}
.strip .who { font-weight: 700; }
.strip .meta {
  font-size: 12.5px;
  color: var(--ink-soft);
  letter-spacing: .02em;
  font-variant-numeric: tabular-nums;
}
.strip .spacer { flex: 1; }

/* ---------- כרטיסים ---------- */

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.eyebrow {
  font-size: 11px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--ink-soft);
  font-weight: 700;
}

.rule { height: 1px; background: var(--line); border: 0; margin: 2px 0; }

/* ---------- לוח התוצאות ---------- */

.scoreboard {
  background: var(--pitch);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.scoreline {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 10px;
}
.scoreline .side { font-weight: 700; font-size: 15px; line-height: 1.2; }
.scoreline .side.away { text-align: left; }
.scoreline .side .mine { color: var(--accent); }
.scoreline .versus {
  font-size: 12px;
  letter-spacing: .14em;
  color: var(--ink-soft);
  font-weight: 700;
  padding: 0 4px;
}
.scoreline .score {
  font-family: "Karantina", sans-serif;
  font-weight: 700;
  font-size: 46px;
  line-height: .8;
  font-variant-numeric: tabular-nums;
  padding: 0 6px;
  white-space: nowrap;
}
.goals { display: flex; flex-direction: column; gap: 3px; }
.goal-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 13.5px;
  color: var(--ink-soft);
}
.goal-row .min {
  direction: ltr;
  unicode-bidi: isolate;
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  color: var(--ink);
  min-width: 30px;
  font-size: 12px;
}
.goal-row.mine { color: var(--accent); font-weight: 700; }
@media (prefers-reduced-motion: no-preference) {
  .goal-row { animation: slide .22s ease-out both; }
  @keyframes slide { from { opacity: 0; transform: translateX(8px); } }
}

/* ---------- הביצוע האישי ---------- */

.perf { display: flex; align-items: center; gap: 14px; }
.perf .rating {
  font-family: "Karantina", sans-serif;
  font-size: 52px;
  line-height: .8;
  font-variant-numeric: tabular-nums;
  direction: ltr;
  min-width: 74px;
  text-align: center;
  padding: 6px 4px;
  border-radius: var(--radius);
  background: var(--surface-2);
}
.perf .rating.good { background: var(--win); color: #fff; }
.perf .rating.bad { background: var(--loss); color: #fff; }
.perf .detail { display: flex; flex-direction: column; gap: 3px; font-size: 14px; }
.perf .detail strong { font-size: 15px; }

/* ---------- רשימות הודעות ---------- */

.notes { display: flex; flex-direction: column; gap: 7px; }
.note { display: flex; gap: 9px; align-items: flex-start; font-size: 14.5px; }
.note .ico { flex: none; width: 20px; text-align: center; }
.note.strong { font-weight: 700; }

/* ---------- כפתורים ---------- */

.btn {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: var(--radius);
  padding: 13px 14px;
  min-height: 46px;
  text-align: right;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: transform .08s ease, border-color .12s ease;
}
.btn:active { transform: scale(.99); }
.btn.primary {
  background: var(--accent-fill);
  border-color: var(--accent-fill);
  color: var(--accent-ink);
  font-weight: 700;
  justify-content: center;
  font-size: 17px;
}
.btn.ghost { background: transparent; }
.btn.wide { width: 100%; justify-content: center; }
.btn[aria-pressed="true"] {
  border-color: var(--accent);
  background: var(--surface-2);
  font-weight: 700;
}
.btn .k { flex: 1; }
.btn .hint { font-size: 12.5px; color: var(--ink-soft); }

.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row .btn { flex: 1; justify-content: center; min-width: 96px; }

.actions { display: flex; flex-direction: column; gap: 8px; }

/* ---------- הרציף התחתון ---------- */

.dock {
  position: sticky;
  bottom: 0;
  z-index: 20;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.dock .btn.primary { margin: 10px 12px; width: calc(100% - 24px); }

.nav {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  border-top: 1px solid var(--line);
}
.dock .btn.primary + .nav { border-top: 0; }
.nav button {
  appearance: none;
  background: none;
  border: 0;
  padding: 11px 2px 13px;
  font-size: 13px;
  color: var(--ink-soft);
  cursor: pointer;
  position: relative;
}
.nav button[aria-current="true"] { color: var(--accent); font-weight: 700; }
.nav button[aria-current="true"]::after {
  content: "";
  position: absolute;
  inset-inline: 26%;
  bottom: 6px;
  height: 2px;
  background: var(--accent);
  border-radius: 2px;
}
.nav button .dot {
  position: absolute;
  top: 9px;
  inset-inline-start: 50%;
  margin-inline-start: 22px;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--loss);
}

/* ---------- טבלת ליגה ---------- */

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 7px 5px; text-align: center; }
th {
  font-size: 10.5px;
  letter-spacing: .08em;
  color: var(--ink-soft);
  font-weight: 700;
  border-bottom: 1px solid var(--line);
}
td.club { text-align: right; font-weight: 600; }
td { border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
tr.me td { background: var(--surface-2); }
tr.me td.club { color: var(--accent); font-weight: 700; }
td.pts { font-weight: 700; }
tr.up td:first-child { box-shadow: inset 3px 0 0 var(--win); }
tr.down td:first-child { box-shadow: inset 3px 0 0 var(--loss); }

/* ---------- תכונות ---------- */

.attrs { display: flex; flex-direction: column; gap: 7px; }
.attr { display: grid; grid-template-columns: 88px 30px 1fr; align-items: center; gap: 8px; font-size: 14px; }
.attr .val { font-variant-numeric: tabular-nums; font-weight: 700; text-align: center; }
.bar { height: 7px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent-fill); border-radius: 99px; }
.bar.soft > i { background: var(--ink-soft); }

.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat {
  background: var(--surface-2);
  border-radius: var(--radius);
  padding: 9px 6px;
  text-align: center;
}
.stat .n {
  font-family: "Karantina", sans-serif;
  font-size: 28px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.stat .l { font-size: 11px; color: var(--ink-soft); letter-spacing: .04em; }

/* ---------- אירוע עלילה (עמוד אחורי של העיתון) ---------- */

.takeover {
  min-height: 100dvh;
  background:
    repeating-linear-gradient(180deg,
      transparent 0 26px,
      color-mix(in srgb, var(--ink) 3%, transparent) 26px 52px),
    var(--pitch);
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 22px 16px 28px;
}
.takeover .kicker {
  font-size: 11px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 700;
}
.takeover h2 { font-size: 44px; }
.takeover .body {
  white-space: pre-wrap;
  font-size: 16.5px;
  line-height: 1.65;
  color: var(--ink);
  max-width: 46ch;
}
.takeover .outcome {
  white-space: pre-wrap;
  font-size: 16.5px;
  line-height: 1.65;
  border-right: 3px solid var(--accent-fill);
  padding-right: 12px;
}

/* ---------- כותרת ראשית / מסך פתיחה ---------- */

.hero { display: flex; flex-direction: column; gap: 6px; padding: 26px 0 6px; }
.hero h1 { font-size: 76px; line-height: .82; }
.hero .underline {
  width: 92px;
  height: 5px;
  background: var(--accent-fill);
  margin: 10px 0 4px;
  margin-inline-end: auto;
}
.screen.menu { justify-content: center; }
.hero .sub { color: var(--ink-soft); font-size: 15px; max-width: 40ch; }
.hero .accent { color: var(--accent); }

.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 99px;
  padding: 8px 13px;
  font-size: 14px;
  cursor: pointer;
  min-height: 40px;
}
.chip[aria-pressed="true"] {
  background: var(--accent-fill);
  border-color: var(--accent-fill);
  color: var(--accent-ink);
  font-weight: 700;
}

input[type="text"], select {
  width: 100%;
  padding: 12px;
  min-height: 46px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--ink);
  font-family: inherit;
  font-size: 16px;
}

.num { direction: ltr; unicode-bidi: isolate; }

.muted { color: var(--ink-soft); font-size: 13.5px; }
.center { text-align: center; }
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 9px;
  border-radius: 99px;
  font-size: 12px;
  font-weight: 700;
  background: var(--surface-2);
  color: var(--ink-soft);
}
.pill.w { background: var(--win); color: #fff; }
.pill.l { background: var(--loss); color: #fff; }
.pill.d { background: var(--draw); color: #fff; }

.honour { display: flex; gap: 9px; font-size: 14.5px; align-items: baseline; }
.honour .yr {
  font-variant-numeric: tabular-nums;
  color: var(--ink-soft);
  font-size: 12.5px;
  min-width: 38px;
}

.squad-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 8px;
  align-items: center;
  padding: 7px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}
.squad-row:last-child { border-bottom: 0; }
.squad-row .pos { font-size: 12px; color: var(--ink-soft); }
.squad-row .ovr {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  min-width: 26px;
  text-align: center;
}
.squad-row.me { color: var(--accent); font-weight: 700; }


/* ---------- גרפיקה ---------- */

.crest { flex: none; display: block; }

.crest-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.crest-row .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.scoreline .side { display: flex; align-items: center; gap: 9px; }
.scoreline .side.away { flex-direction: row-reverse; }
.scoreline .side .nm { font-weight: 700; font-size: 15px; line-height: 1.15; }

.pitch {
  width: 100%;
  max-width: 240px;
  margin: 0 auto;
  display: block;
  border-radius: var(--radius);
  border: 1px solid var(--line);
}
.timeline { width: 100%; display: block; }

.form { display: inline-flex; gap: 3px; vertical-align: middle; }
.form .f {
  width: 17px; height: 17px;
  border-radius: 3px;
  font-size: 10.5px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
}
.form .f-w { background: var(--win); }
.form .f-d { background: var(--draw); }
.form .f-l { background: var(--loss); }

.chart { width: 100%; display: block; overflow: visible; }

.stadium {
  width: 100%;
  display: block;
  border-radius: var(--radius);
  background: var(--surface-2);
  margin-bottom: 4px;
}

.trophy { flex: none; vertical-align: -3px; }

.kit-row { display: flex; align-items: center; gap: 16px; }
.kit-row .kit-meta { display: flex; flex-direction: column; gap: 2px; }
.kit-row .kit-meta .big {
  font-family: "Karantina", sans-serif;
  font-size: 30px;
  line-height: 1;
}

td.club .crest-row { gap: 6px; }
td.form-cell { width: 1%; white-space: nowrap; }
.squad-row .crest-row { gap: 7px; }
.squad-row .num {
  font-variant-numeric: tabular-nums;
  color: var(--ink-soft);
  font-size: 12px;
  min-width: 18px;
  text-align: center;
}


/* ---------- סצנות מאוירות ---------- */

.scene {
  display: block;
  width: 100%;
  height: auto;
}
.scene-frame {
  position: relative;
  margin-inline: -16px;
  border-bottom: 1px solid var(--line);
  overflow: hidden;
}
.screen .scene-frame { margin-inline: -14px; }
.scene-frame.inset {
  margin: -14px -14px 2px;
  border-radius: var(--radius) var(--radius) 0 0;
}
/* מסך שנפתח בסצנה — בלי ריווח מעליה */
.takeover.flush, .screen.flush { padding-top: 0; }
@media (prefers-reduced-motion: no-preference) {
  .scene-frame .scene { animation: sceneIn .5s ease-out both; }
  @keyframes sceneIn { from { opacity: 0; transform: scale(1.06); } }
}

/* ---------- כרטיס שחקן ---------- */

.pcard {
  border-radius: 10px;
  padding: 14px;
  background: linear-gradient(150deg, var(--card-a) 0%, var(--card-b) 78%);
  color: var(--card-ink);
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.pcard::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(200deg, rgba(255,255,255,.14), transparent 55%);
  pointer-events: none;
}
.pcard-top { display: flex; align-items: flex-start; gap: 10px; }
.pcard-rating { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 62px; }
.pcard-rating .n {
  font-family: "Karantina", sans-serif;
  font-size: 54px;
  line-height: .82;
}
.pcard-rating .pos { font-size: 13px; font-weight: 700; letter-spacing: .02em; }
.pcard-rating .rule { width: 26px; height: 1.5px; background: currentColor; opacity: .5; margin: 3px 0; }
.pcard-rating .nat { font-size: 11px; opacity: .85; }
.pcard-art { flex: 1; display: flex; justify-content: center; }
.pcard-name {
  font-family: "Karantina", sans-serif;
  font-size: 34px;
  line-height: 1;
  border-top: 1.5px solid currentColor;
  border-bottom: 1.5px solid currentColor;
  padding: 5px 0;
  text-align: center;
}
.pcard-attrs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 4px; }
.pcard-attrs .pa { display: flex; align-items: baseline; justify-content: center; gap: 5px; }
.pcard-attrs .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pcard-attrs .k { font-size: 11px; opacity: .8; }
.pcard-foot {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  opacity: .92;
  border-top: 1px solid currentColor;
  padding-top: 8px;
}
.pcard-foot .spacer { flex: 1; }

/* ---------- לוח תוצאות דרמטי ---------- */

.scoreboard.result { position: relative; overflow: hidden; }
.scoreboard.result::before {
  content: "";
  position: absolute;
  inset-inline-start: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--accent-fill);
}
.comp-tag {
  align-self: flex-start;
  background: var(--accent-fill);
  color: var(--accent-ink);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .1em;
  padding: 2px 9px;
  border-radius: 2px;
}

@media (prefers-reduced-motion: no-preference) {
  .scoreboard.result .side { animation: sideIn .42s cubic-bezier(.2,.7,.3,1) both; }
  .scoreboard.result .side.away { animation-name: sideInAway; }
  .scoreboard.result .score { animation: scorePop .5s .2s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes sideIn { from { opacity: 0; transform: translateX(18px); } }
  @keyframes sideInAway { from { opacity: 0; transform: translateX(-18px); } }
  @keyframes scorePop { from { opacity: 0; transform: scale(.6); } }
  .timeline { animation: fadeUp .4s .34s ease-out both; }

const SEASON_WEEKS = 26;
const CUP_WEEKS = { 5: "שמינית הגמר", 11: "רבע הגמר", 17: "חצי הגמר", 23: "גמר הגביע" };
const SQUAD_MIN = 16;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// -- מחולל מספרים אקראיים עם זרע (כדי ששמירה וטעינה יחזירו בדיוק אותו עולם) --
class Rng {
  constructor(seed) { this.s = (seed >>> 0) || 1; this.spare = null; }
  random() {
    this.s = (this.s + 0x6D2B79F5) >>> 0;
    let t = this.s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  uniform(a, b) { return a + (b - a) * this.random(); }
  randint(a, b) { return a + Math.floor(this.random() * (b - a + 1)); }
  gauss(mu, sigma) {
    if (this.spare !== null) { const v = this.spare; this.spare = null; return mu + sigma * v; }
    let u = 0, v = 0, s = 0;
    do { u = this.random() * 2 - 1; v = this.random() * 2 - 1; s = u * u + v * v; }
    while (s >= 1 || s === 0);
    const mul = Math.sqrt(-2 * Math.log(s) / s);
    this.spare = v * mul;
    return mu + sigma * u * mul;
  }
  choice(arr) { return arr[Math.floor(this.random() * arr.length)]; }
  shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(this.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  weighted(pairs) {                       // [[value, weight], ...]
    const total = pairs.reduce((a, p) => a + p[1], 0);
    let roll = this.random() * total, upto = 0;
    for (const [value, weight] of pairs) { upto += weight; if (roll <= upto) return value; }
    return pairs[pairs.length - 1][0];
  }
  state() { return [this.s, this.spare]; }
  static fromState(st) { const r = new Rng(1); r.s = st[0] >>> 0; r.spare = st[1]; return r; }
}

function newStats() {
  return { apps: 0, goals: 0, assists: 0, cleanSheets: 0, yellow: 0, red: 0,
           minutes: 0, ratingSum: 0, motm: 0, trophies: 0 };
}
function avgRating(s) { return s.apps ? Math.round((s.ratingSum / s.apps) * 100) / 100 : 0; }
function mergeStats(target, other) {

                   "minutes", "ratingSum", "motm"]) target[k] += other[k];

function overall(p) {
  const w = D.POSITION_WEIGHTS[p.position];
  let total = 0;
  for (const attr of D.ATTRIBUTES) total += (p.attributes[attr] ?? 50) * w[attr];
  return Math.round(total);
}

function effective(p) {
  let base = overall(p);
  base += (p.form - 50) * 0.12;
  base += (p.morale - 50) * 0.05;
  base *= 0.85 + 0.15 * (p.fitness / 100);
  return clamp(base, 20, 99);
}

function playerValue(p) {
  const ovr = overall(p);
  const base = Math.pow(Math.max(0, ovr - 40), 3) * 55;
  let ageMod;
  if (p.age <= 20) ageMod = 1.35;
  else if (p.age <= 23) ageMod = 1.25;
  else if (p.age <= 27) ageMod = 1.0;
  else if (p.age <= 30) ageMod = 0.7;
  else if (p.age <= 33) ageMod = 0.4;
  else ageMod = 0.18;
  const potMod = 1 + Math.max(0, p.potential - ovr) * 0.02;
  const repMod = 0.8 + p.reputation / 250;
  return Math.round(base * ageMod * potMod * repMod);
}

function wageForOverall(ovr) {
  return Math.round(clamp(8000 * Math.pow(Math.max(20, ovr) / 50, 6.85), 700, 1200000));
}

function isAvailable(p) { return p.injuryWeeks <= 0 && !p.retired; }
function positionHe(p) { return D.POSITION_NAMES_HE[p.position]; }
function hasTrait(p, t) { return p.traits.includes(t); }

function generateAttributes(rng, position, target) {
  const w = D.POSITION_WEIGHTS[position];
  const attrs = {};
  for (const attr of D.ATTRIBUTES) {
    const spread = rng.gauss(0, 7);
    attrs[attr] = Math.round(clamp(target + (w[attr] - 0.15) * 45 + spread, 15, 96));
  }
  const heaviest = D.ATTRIBUTES.reduce((a, b) => (w[a] >= w[b] ? a : b));
  for (let i = 0; i < 40; i++) {
    let current = 0;
    for (const attr of D.ATTRIBUTES) current += attrs[attr] * w[attr];
    const diff = target - current;
    if (Math.abs(diff) < 0.6) break;
    attrs[heaviest] = Math.round(clamp(attrs[heaviest] + (diff > 0 ? 1 : -1), 15, 96));
  }
  return attrs;
}

let PID_COUNTER = 0;
function generatePlayer(rng, club, position, opts = {}) {
  const usedNames = opts.usedNames || null;
  const age = opts.age ?? rng.randint(17, 35);
  const rep = club ? club.reputation : 40;
  let quality = opts.quality;
  if (quality === undefined) quality = Math.round(clamp(rng.gauss(rep * 0.70 + 20, 6), 28, 92));
  if (age < 21) quality = Math.round(quality - (21 - age) * 2.5);
  const potential = Math.round(clamp(
    quality + Math.max(0, 26 - age) * rng.uniform(0.4, 1.6) + rng.gauss(0, 3), quality, 95));

  let name = null;
  for (let i = 0; i < 60 && name === null; i++) {
    const candidate = `${rng.choice(D.FIRST_NAMES)} ${rng.choice(D.LAST_NAMES)}`;
    if (!usedNames || !usedNames.has(candidate)) { name = candidate; if (usedNames) usedNames.add(candidate); }
  }
  if (name === null) name = `${rng.choice(D.FIRST_NAMES)} ${rng.choice(D.LAST_NAMES)} ${rng.randint(2, 99)}`;

  const p = {
    pid: "p" + (++PID_COUNTER),
    name, age, position,
    nationality: rng.weighted(D.NATIONALITIES),
    attributes: generateAttributes(rng, position, quality),
    growth: {},
    potential,
    clubId: club ? club.cid : null,
    contract: { wage: 0, yearsLeft: rng.randint(1, 4) },
    form: rng.uniform(40, 60),
    morale: rng.uniform(45, 75),
    fitness: 100,
    injuryWeeks: 0,
    injuryName: "",
    reputation: clamp(quality - 25 + rng.gauss(0, 6), 1, 95),
    traits: [],
    isHuman: false,
    coaching: clamp(rng.gauss(10, 6), 0, 40),
    mediaSkill: clamp(rng.gauss(10, 6), 0, 40),
    business: clamp(rng.gauss(8, 5), 0, 40),
    badges: 0,
    season: newStats(),
    career: newStats(),
    retired: false,
  };
  p.contract.wage = wageForOverall(overall(p));
  if (rng.random() < 0.35) p.traits.push(rng.choice(Object.keys(D.TRAITS)));
  return p;
}

// מספרי חולצה — לכל עמדה יש את המספרים המסורתיים שלה
const NUMBER_PREF = {
  GK: [1, 12, 23], CB: [4, 5, 2, 3, 6], LB: [3, 15], RB: [2, 14],
  DM: [6, 16, 4], CM: [8, 18, 20], AM: [10, 7, 21],
  LW: [11, 17], RW: [7, 17, 22], ST: [9, 19, 29],
};

/** נותן לשחקן מספר חולצה פנוי במועדון, בעדיפות למספר המסורתי של העמדה. */
function assignNumber(club, players, player) {
  const taken = new Set(club.squad
    .map(pid => players[pid])
    .filter(p => p && p !== player && p.number)
    .map(p => p.number));
  for (const n of (NUMBER_PREF[player.position] || [])) {
    if (!taken.has(n)) { player.number = n; return n; }
  }
  for (let n = 2; n <= 45; n++) {
    if (!taken.has(n)) { player.number = n; return n; }
  }
  player.number = 0;
  return 0;
}

function generateWorld(seed) {
  const rng = new Rng(seed);
  const clubs = {}, players = {}, usedNames = new Set();
  for (const [cid, name, nickname, leagueId, rep, budget] of D.CLUBS) {
    const club = {
      cid, name, nickname, leagueId, reputation: rep, budget,
      wageBudget: Math.round(budget * 1000000 / 10),
      trainingFacilities: Math.round(clamp(rep + rng.gauss(0, 8), 15, 99)),
      youthAcademy: Math.round(clamp(rep + rng.gauss(0, 12), 15, 99)),
      managerName: rng.choice(D.MANAGER_NAMES),
      managerTrust: 50,
      boardConfidence: 60,
      fanSupport: clamp(rep + rng.gauss(0, 10), 20, 99),
      formation: rng.choice(Object.keys(D.FORMATIONS)),
      squad: [],
      seasonExpectation: "אמצע טבלה",
      trophies: [],
    };
    for (const position of D.SQUAD_TEMPLATE) {
      const p = generatePlayer(rng, club, position, { usedNames });
      players[p.pid] = p;
      club.squad.push(p.pid);
      assignNumber(club, players, p);
    }
    clubs[cid] = club;
  }
  return { clubs, players };
}

const FIT_GROUPS = [["CB"], ["LB", "RB"], ["DM", "CM"], ["CM", "AM"],
                    ["LW", "RW", "AM"], ["ST", "LW", "RW"]];

function positionFit(playerPos, slot) {
  if (playerPos === slot) return 1.0;
  if ((playerPos === "GK") !== (slot === "GK")) return 0.35;
  for (const group of FIT_GROUPS) {
    if (group.includes(playerPos) && group.includes(slot)) return 0.90;
  }
  return 0.72;
}

function pickLineup(club, players, formation, forced) {
  formation = formation || club.formation;
  const slots = D.FORMATIONS[formation] || D.FORMATIONS["4-3-3"];
  const available = club.squad.map(pid => players[pid]).filter(p => p && isAvailable(p));
  const lineup = new Array(slots.length).fill(null);
  const used = new Set();
  const claim = (idx, p) => { lineup[idx] = p.pid; used.add(p.pid); };

  // מי שנכפה להרכב תופס ראשון את המשבצת הכי מתאימה לו
  for (const pid of (forced || [])) {
    const p = players[pid];
    if (!p || used.has(pid) || !available.includes(p)) continue;
    let bestIdx = -1, bestFit = 0;
    slots.forEach((slot, idx) => {
      if (lineup[idx]) return;
      const fit = positionFit(p.position, slot);
      if (fit > bestFit) { bestFit = fit; bestIdx = idx; }
    });
    if (bestIdx >= 0) claim(bestIdx, p);
  }

  // מעבר ראשון: רק שחקנים בעמדתם הטבעית. מעבר שני: מי שנשאר.
  for (const minFit of [0.9, 0]) {
    for (let idx = 0; idx < slots.length; idx++) {
      if (lineup[idx]) continue;
      const slot = slots[idx];
      const candidates = available.filter(p =>
        !used.has(p.pid) && positionFit(p.position, slot) >= minFit);
      if (!candidates.length) continue;
      claim(idx, candidates.reduce((a, b) =>
        effective(a) * positionFit(a.position, slot) >=
        effective(b) * positionFit(b.position, slot) ? a : b));
    }
  }
  return lineup.filter(Boolean);
}

function teamStrength(lineup, players, formation) {
  const slots = D.FORMATIONS[formation] || D.FORMATIONS["4-3-3"];
  const sums = { def: 0, mid: 0, att: 0 };
  const shares = { def: 0, mid: 0, att: 0 };
  lineup.forEach((pid, idx) => {
    const p = players[pid];
    if (!p) return;
    const slot = idx < slots.length ? slots[idx] : p.position;
    const fit = positionFit(p.position, slot);
    const power = effective(p) * (0.62 + 0.38 * fit);
    const share = D.POSITION_ROLE_SHARE[slot];
    for (const line of ["def", "mid", "att"]) {
      sums[line] += power * share[line];
      shares[line] += share[line];
    }
  });
  const baselines = { def: 5.05, mid: 3.10, att: 2.85 };
  const out = {};
  for (const line of ["def", "mid", "att"]) {
    const average = shares[line] > 0.01 ? sums[line] / shares[line] : 40;
    out[line] = average * Math.pow(Math.max(0.4, shares[line]) / baselines[line], 0.4);
  }
  return out;
}

function poisson(rng, lam) {
  lam = Math.max(0.02, lam);
  const limit = Math.exp(-lam);
  let k = 0, prod = rng.random();
  while (prod > limit && k < 12) { k++; prod *= rng.random(); }
  return k;
}

function simulateMatch(home, away, players, rng, opts = {}) {
  const homeTac = opts.homeTactics || {};
  const awayTac = opts.awayTactics || {};
  const competition = opts.competition || "ליגה";
  const neutral = !!opts.neutral;

  const homeForm = homeTac.formation || home.formation;
  const awayForm = awayTac.formation || away.formation;
  const homeLineup = pickLineup(home, players, homeForm, homeTac.forced);
  const awayLineup = pickLineup(away, players, awayForm, awayTac.forced);

  const hs = teamStrength(homeLineup, players, homeForm);
  const as = teamStrength(awayLineup, players, awayForm);

  const hMent = D.MENTALITIES[homeTac.mentality || "balanced"];
  const aMent = D.MENTALITIES[awayTac.mentality || "balanced"];
  const hPress = D.PRESSING[homeTac.pressing || "medium"];
  const aPress = D.PRESSING[awayTac.pressing || "medium"];

  let ha = hs.att * hMent[1] * (1 + hPress[1]);
  let hd = hs.def * hMent[2] * (1 + hPress[2]);
  let hm = hs.mid;
  let aa = as.att * aMent[1] * (1 + aPress[1]);
  let ad = as.def * aMent[2] * (1 + aPress[2]);
  const am = as.mid;

  if (!neutral) {
    ha *= 1 + home.fanSupport / 640;
    hd *= 1.02;
    hm *= 1.03;
  }

  const totalMid = hm + am;
  const hControl = totalMid ? hm / totalMid : 0.5;
  const aControl = 1 - hControl;

  const expected = (attack, defence, control, talk) => {
    const edge = (attack - defence) / 11;
    let base = 1.38 * Math.exp(edge * 0.38);
    base *= 0.55 + 0.9 * control;
    base *= 0.9 + talk * 0.2;
    return clamp(base, 0.12, 4.6);
  };

  const homeGoals = poisson(rng, expected(ha, ad, hControl, homeTac.talkBoost || 0));
  const awayGoals = poisson(rng, expected(aa, hd, aControl, awayTac.talkBoost || 0));

  const result = {
    homeId: home.cid, awayId: away.cid, homeGoals, awayGoals,
    events: [], ratings: {}, motm: null,
    homeLineup, awayLineup, commentary: [], competition,
  };

  const total = homeGoals + awayGoals;
  const minutes = [];
  while (minutes.length < total) {
    const m = rng.randint(1, 93);
    if (!minutes.includes(m)) minutes.push(m);
  }
  minutes.sort((a, b) => a - b);

  const queue = [];
  for (let i = 0; i < homeGoals; i++) queue.push(home.cid);
  for (let i = 0; i < awayGoals; i++) queue.push(away.cid);
  rng.shuffle(queue);

  queue.forEach((clubId, idx) => {
    const minute = minutes[idx] ?? rng.randint(1, 93);
    const lineup = clubId === home.cid ? homeLineup : awayLineup;
    const scorer = pickScorer(lineup, players, rng);
    if (!scorer) return;
    players[scorer].season.goals += 1;
    result.events.push({ minute, kind: "goal", clubId, playerId: scorer,
                         text: `${minute}' ${players[scorer].name}` });
    const assister = pickAssister(lineup, players, rng, scorer);
    if (assister) {
      players[assister].season.assists += 1;
      result.events.push({ minute, kind: "assist", clubId, playerId: assister,
                           text: `בישול: ${players[assister].name}` });
    }
  });

  applyDiscipline(result, homeLineup, home.cid, players, rng, hPress[3]);
  applyDiscipline(result, awayLineup, away.cid, players, rng, aPress[3]);
  applyInjuries(result, homeLineup, home.cid, players, rng);
  applyInjuries(result, awayLineup, away.cid, players, rng);
  ratePlayers(result, homeLineup, home.cid, players, rng);
  ratePlayers(result, awayLineup, away.cid, players, rng);

  const rated = Object.keys(result.ratings);
  if (rated.length) {
    result.motm = rated.reduce((a, b) => (result.ratings[a] >= result.ratings[b] ? a : b));
    players[result.motm].season.motm += 1;
  }
  if (awayGoals === 0 && homeLineup.length) players[homeLineup[0]].season.cleanSheets += 1;
  if (homeGoals === 0 && awayLineup.length) players[awayLineup[0]].season.cleanSheets += 1;

  result.commentary = buildCommentary(result, home, away, players);
  return result;
}

function resultFor(result, clubId) {
  if (result.homeGoals === result.awayGoals) return "D";
  if (clubId === result.homeId) return result.homeGoals > result.awayGoals ? "W" : "L";
  return result.awayGoals > result.homeGoals ? "W" : "L";
}
function goalsFor(result, clubId) { return clubId === result.homeId ? result.homeGoals : result.awayGoals; }
function goalsAgainst(result, clubId) { return clubId === result.homeId ? result.awayGoals : result.homeGoals; }

function pickScorer(lineup, players, rng) {
  const weights = [];
  for (const pid of lineup) {
    const p = players[pid];
    if (!p) continue;
    const share = D.POSITION_ROLE_SHARE[p.position];
    let w = share.att * 3.0 + share.mid * 0.7 + share.def * 0.12;
    w *= Math.pow((p.attributes.shooting ?? 40) / 55, 1.5);
    w *= 0.7 + p.form / 140;
    weights.push([pid, Math.max(0.001, w)]);
  }
  return weights.length ? rng.weighted(weights) : null;
}

function pickAssister(lineup, players, rng, scorer) {
  if (rng.random() < 0.26) return null;
  const weights = [];
  for (const pid of lineup) {
    if (pid === scorer) continue;
    const p = players[pid];
    if (!p) continue;
    const share = D.POSITION_ROLE_SHARE[p.position];
    let w = share.att * 1.6 + share.mid * 1.8 + share.def * 0.2;
    w *= Math.pow((p.attributes.passing ?? 40) / 55, 1.4);
    weights.push([pid, Math.max(0.001, w)]);
  }
  return weights.length ? rng.weighted(weights) : null;
}

function applyDiscipline(result, lineup, clubId, players, rng, pressFactor) {
  for (const pid of lineup) {
    const p = players[pid];
    if (!p) continue;
    let chance = 0.055 * pressFactor;
    if (hasTrait(p, "hothead")) chance *= 2.4;
    chance *= 1 + D.POSITION_ROLE_SHARE[p.position].def * 0.6;
    if (rng.random() < chance) {
      const minute = rng.randint(5, 92);
      if (rng.random() < 0.09) {
        p.season.red += 1;
        result.events.push({ minute, kind: "red", clubId, playerId: pid, text: `${minute}' ${p.name}` });
      } else {
        p.season.yellow += 1;
        result.events.push({ minute, kind: "yellow", clubId, playerId: pid, text: `${minute}' ${p.name}` });
      }
    }
  }
}

function applyInjuries(result, lineup, clubId, players, rng) {
  for (const pid of lineup) {
    const p = players[pid];
    if (!p) continue;
    let chance = 0.016;
    chance *= 1 + Math.max(0, 70 - p.fitness) / 90;
    chance *= 1 + Math.max(0, p.age - 30) * 0.09;
    if (hasTrait(p, "glass")) chance *= 2.2;
    if (rng.random() < chance) {
      const [name, low, high] = rng.choice(D.INJURY_TYPES);
      const weeks = rng.randint(low, high);
      p.injuryWeeks = weeks;
      p.injuryName = name;
      p.fitness = Math.min(p.fitness, 55);
      result.events.push({ minute: rng.randint(3, 90), kind: "injury", clubId, playerId: pid,
                           text: `${p.name} — ${name} (${weeks} שבועות)` });
    }
  }
}

function ratePlayers(result, lineup, clubId, players, rng) {
  const conceded = goalsAgainst(result, clubId);
  const outcome = resultFor(result, clubId);
  const teamMod = { W: 0.45, D: 0, L: -0.35 }[outcome];
  const goalsBy = {}, assistsBy = {}, cards = {};
  for (const ev of result.events) {
    if (ev.clubId !== clubId) continue;
    if (ev.kind === "goal") goalsBy[ev.playerId] = (goalsBy[ev.playerId] || 0) + 1;
    else if (ev.kind === "assist") assistsBy[ev.playerId] = (assistsBy[ev.playerId] || 0) + 1;
    else if (ev.kind === "yellow" || ev.kind === "red")
      cards[ev.playerId] = (cards[ev.playerId] || 0) + (ev.kind === "yellow" ? 1 : 3);
  }
  for (const pid of lineup) {
    const p = players[pid];
    if (!p) continue;
    let rating = 6.0 + teamMod + rng.gauss(0, 0.55);
    rating += (effective(p) - 60) * 0.017;
    rating += (goalsBy[pid] || 0) * 1.05;
    rating += (assistsBy[pid] || 0) * 0.65;
    rating -= (cards[pid] || 0) * 0.28;
    const share = D.POSITION_ROLE_SHARE[p.position];
    rating -= conceded * 0.24 * share.def;
    if (conceded === 0) rating += 0.45 * share.def;
    if (hasTrait(p, "clutch") && rng.random() < 0.4) rating += 0.4;
    rating = Math.round(clamp(rating, 3, 10) * 10) / 10;
    result.ratings[pid] = rating;

    const minutes = rng.random() > 0.18 ? 90 : rng.randint(55, 89);
    p.season.apps += 1;
    p.season.minutes += minutes;
    p.season.ratingSum += rating;
    p.fitness = clamp(p.fitness - minutes * 0.13 - rng.uniform(0, 6), 8, 100);
    p.form = clamp(p.form * 0.82 + (rating - 6.0) * 14 + 9, 5, 99);
    p.morale = clamp(p.morale + (outcome === "W" ? 2.5 : outcome === "L" ? -2.0 : 0.3)
                     + (rating - 6.5) * 1.6, 5, 99);
  }
}

function buildCommentary(result, home, away, players) {
  const lines = [];
  const diff = result.homeGoals - result.awayGoals;
  const total = result.homeGoals + result.awayGoals;
  if (total === 0) lines.push("שני שוערים מצוינים, אפס דרמה. 0:0 שאף אחד לא יזכור.");
  else if (Math.abs(diff) >= 3)
    lines.push(`${diff > 0 ? home.name : away.name} פשוט דרסו. הקהל התחיל לצאת ברבע שעה האחרונה.`);
  else if (diff === 0) lines.push("תיקו שמשאיר את שתי הקבוצות עם טעם מריר.");
  else lines.push(`${diff > 0 ? home.name : away.name} לקחו את זה בשיניים. משחק צמוד עד השריקה האחרונה.`);
  return lines;
}

const OFF_PITCH = ["rest", "badges", "media", "business"];

function ageFactor(age) {
  if (age < 16) return 1.7;
  if (age > 38) return -1.1;
  return D.AGE_CURVE[String(age)];
}

function addGrowth(p, attr, delta) {
  p.growth[attr] = (p.growth[attr] || 0) + delta;
  const whole = Math.trunc(p.growth[attr]);
  if (whole) {
    p.attributes[attr] = Math.round(clamp((p.attributes[attr] ?? 50) + whole, 10, 97));
    p.growth[attr] -= whole;
  }
}

function weeklyTraining(p, focus, club, rng, intensity = 1.0) {
  const messages = [];
  const facilities = club ? club.trainingFacilities : 45;

  if (focus === "rest") {
    p.fitness = clamp(p.fitness + 26, 0, 100);
    p.morale = clamp(p.morale + 1.5, 0, 100);
    if (p.injuryWeeks > 0) {
      p.injuryWeeks = Math.max(0, p.injuryWeeks - 1);
      if (rng.random() < 0.3) {
        p.injuryWeeks = Math.max(0, p.injuryWeeks - 1);
        messages.push({ icon: "🏥", text: "השיקום מתקדם מהר מהצפוי." });
      }
    }
    return messages;
  }

  if (focus === "badges") {
    let gain = (0.55 + (p.attributes.mental ?? 50) / 200) * intensity;
    if (hasTrait(p, "student")) gain *= 1.4;
    p.coaching = clamp(p.coaching + gain, 0, 100);
    p.fitness = clamp(p.fitness + 10, 0, 100);
    const newBadges = Math.min(4, Math.floor(p.coaching / 22));
    if (newBadges > p.badges) {
      p.badges = newBadges;
      messages.push({ icon: "🎓", text: `השלמת תעודת אימון רמה ${p.badges}!` });
    }
    return messages;
  }

  if (focus === "media") {
    p.mediaSkill = clamp(p.mediaSkill + 0.9 * intensity, 0, 100);
    p.reputation = clamp(p.reputation + 0.25, 0, 100);
    p.fitness = clamp(p.fitness + 9, 0, 100);
    return messages;
  }

  if (focus === "business") {
    p.business = clamp(p.business + 0.85 * intensity, 0, 100);
    p.fitness = clamp(p.fitness + 9, 0, 100);
    return messages;
  }

  p.fitness = clamp(p.fitness + 12 - 6 * intensity, 0, 100);
  if (p.injuryWeeks > 0) {
    p.injuryWeeks = Math.max(0, p.injuryWeeks - 1);
    return [{ icon: "🩹", text: "אתה בשיקום — האימון היה קל בהרבה." }];
  }

  const gap = p.potential - overall(p);
  const curve = ageFactor(p.age);
  let base = 0.30 * intensity;
  base *= 0.55 + facilities / 110;
  base *= Math.max(0.15, curve);
  base *= 1 + clamp(gap, -10, 25) * 0.05;
  if (hasTrait(p, "workhorse")) base *= 1.30;
  base *= 0.75 + p.morale / 200;
  base *= rng.uniform(0.7, 1.35);

  const headroom = p.potential - overall(p);
  if (headroom <= 0) base *= 0.08;
  else if (headroom < 4) base *= 0.25 + headroom * 0.18;

  let current = (p.growth[focus] || 0) + base;
  let gained = 0;
  while (current >= 1.0 && (p.attributes[focus] ?? 50) < 97) {
    p.attributes[focus] = (p.attributes[focus] ?? 50) + 1;
    current -= 1;
    gained += 1;
  }
  p.growth[focus] = current;
  if (gained) {
    messages.push({ icon: "📈", text:
      `${D.ATTRIBUTE_NAMES_HE[focus]} עלתה ב-${gained} (עכשיו ${p.attributes[focus]}).` });
  }
  if (intensity > 1.15 && rng.random() < 0.035 * intensity) {
    const weeks = rng.randint(1, 3);
    p.injuryWeeks = weeks;
    p.injuryName = "עומס יתר באימון";
    messages.push({ icon: "🚑", text: `נמתחת באימון — ${weeks} שבועות בחוץ.` });
  }
  return messages;
}

function weeklyRecovery(p, played, rng) {
  if (p.injuryWeeks > 0) {
    p.injuryWeeks -= 1;
    if (p.injuryWeeks === 0) { p.injuryName = ""; p.fitness = clamp(p.fitness + 15, 0, 100); }
  }
  if (!played) p.fitness = clamp(p.fitness + 9, 0, 100);
  p.form = clamp(p.form + (played ? 0 : rng.uniform(-1.5, 1.5)), 5, 99);
}

function simulateAiWeek(players, rng, clubs, skip) {
  for (const pid in players) {
    const p = players[pid];
    if (pid === skip || p.retired) continue;
    const club = p.clubId ? clubs[p.clubId] : null;
    if (p.injuryWeeks > 0) {
      p.injuryWeeks -= 1;
      if (p.injuryWeeks === 0) p.injuryName = "";
      continue;
    }
    p.fitness = clamp(p.fitness + rng.uniform(6, 16), 0, 100);
    if (rng.random() < 0.55) weeklyTraining(p, rng.choice(D.ATTRIBUTES), club, rng, 0.85);
  }
}

function endOfSeasonDevelopment(p, rng, minutesShare = 0.5) {
  p.age += 1;
  const curve = ageFactor(p.age);
  const exposure = 0.45 + minutesShare * 1.1;
  for (const attr of D.ATTRIBUTES) {
    const sensitivity = D.DECLINE_SENSITIVITY[attr];
    let delta;
    if (curve > 0) {
      delta = curve * exposure * rng.uniform(0.4, 1.5);
      if (overall(p) >= p.potential) delta *= 0.08;
    } else {
      delta = curve * Math.max(0.2, sensitivity) * rng.uniform(0.5, 1.5);
    }
    addGrowth(p, attr, delta);
  }
  const s = p.season;
  if (s.apps) {
    const contribution = (s.goals + s.assists) / Math.max(1, s.apps);
    p.reputation = clamp(p.reputation + (avgRating(s) - 6.6) * 4 + contribution * 6, 1, 99);
  }
  mergeStats(p.career, s);
  p.season = newStats();
  p.fitness = 100;
  p.form = 50;
  if (p.contract.yearsLeft > 0) p.contract.yearsLeft -= 1;
}

function shouldRetire(p, rng) {
  if (p.age < 32) return false;
  let chance = (p.age - 31) * 0.16;
  if (overall(p) < 55) chance += 0.18;
  if (p.injuryWeeks > 12) chance += 0.25;
  return rng.random() < clamp(chance, 0, 0.95);
}

function retirementPressure(p) {
  let pressure = 0;
  pressure += Math.max(0, p.age - 31) * 0.13;
  pressure += Math.max(0, 62 - overall(p)) * 0.012;
  if (p.injuryWeeks >= 10) pressure += 0.25;
  if (p.contract.yearsLeft === 0 && p.age > 33) pressure += 0.15;
  return clamp(pressure, 0, 1);
}

function roundRobin(teams, rng) {
  teams = rng.shuffle(teams.slice());
  if (teams.length % 2) teams.push("__bye__");
  const n = teams.length;
  const rounds = [];
  for (let r = 0; r < n - 1; r++) {
    const pairs = [];
    for (let i = 0; i < n / 2; i++) {
      const home = teams[i], away = teams[n - 1 - i];
      if (home === "__bye__" || away === "__bye__") continue;
      pairs.push(r % 2 === 0 ? [home, away] : [away, home]);
    }
    rounds.push(pairs);
    teams = [teams[0], teams[n - 1], ...teams.slice(1, n - 1)];
  }
  return rounds.concat(rounds.map(rnd => rnd.map(([h, a]) => [a, h])));
}

function leagueWeeks() {
  const out = [];
  for (let w = 1; w <= SEASON_WEEKS; w++) if (!CUP_WEEKS[w]) out.push(w);
  return out;
}

  weight: 3.0, once: false,
  cond: g => g.noStartStreak >= 4 && g.me.age >= 19,
  body: g => `חמישה משחקים. אפס דקות.\nאתה עומד מול הדלת של ${g.myClub().managerName} ומחזיק את הידית.`,
  choices: [
    { label: "להיכנס ולהתעמת", hint: "מר-רווח: או שתשחק או שתיגמר", apply: g => g.confrontManager() },
    { label: "לשתוק ולהתאמן כפול", hint: "אמון ↑, מורל ↓",
      apply: g => { att(g, "physical", 1.0); tru(g, 6); mor(g, -5);
        return "נשארת אחרי כל אימון. הצוות שם לב. הסבלנות עולה לך במצב רוח."; } },
    { label: "לבקש מהסוכן למצוא מועדון אחר", hint: "פותח שוק העברות",
      apply: g => { g.setFlag("wants_transfer", true); tru(g, -10);
        return "הסוכן התחיל לעבוד. בחלון הקרוב יגיעו הצעות — והמאמן כבר יודע שאתה בדרך החוצה."; } },
  ],
});

ev({
  eid: "derby_week", title: "שבוע דרבי", stages: ["player", "veteran"], weight: 2.0, once: false,
  cond: g => g.week >= 3,
  body: g => `העיר לא ישנה. שלטי חוצות, אוהדים מחוץ למתחם האימונים,\n` +
    `וכתבה שמצטטת שחקן מהיריבה: "${g.me.name}? לא מכיר."`,
  choices: [
    { label: "לענות לו בתקשורת", hint: "מוניטין ↑, לחץ ↑",
      apply: g => { rep(g, 4); fan(g, 6); g.setFlag("derby_beef", true);
        return "הכותרת שלך פתחה את המהדורה. עכשיו אסור לך לככב פחות מהמצוין."; } },
    { label: "לשתוק ולעלות על המגרש",
      apply: g => { mor(g, 4); att(g, "mental", 0.8);
        return "לא אמרת מילה כל השבוע. בחדר ההלבשה זה נשמע חזק יותר מכל ציטוט."; } },
    { label: "להזמין את המשפחה ליציע ולנשום",
      apply: g => { mor(g, 7); return "ראית אותם ביציע בחימום. פתאום זה שוב רק כדורגל."; } },
  ],
});

ev({
  eid: "scandal_night", title: "צילום מהמועדון", stages: ["player", "veteran"], weight: 1.6, once: true,
  cond: g => g.me.age >= 19 && g.me.reputation >= 30,
  body: () => "3:40 לפנות בוקר. מישהו צילם אותך יוצא ממועדון לילה\n" +
    "שני ימים לפני משחק. הסרטון כבר ברשת.\nהדובר מחכה לתשובה שלך עוד עשר דקות.",
  choices: [
    { label: "להתנצל בפומבי ולקחת אחריות",
      apply: g => { rep(g, -3); tru(g, 4); fan(g, 2); mor(g, -2);
        return "התנצלת בלי תירוצים. התקשורת התייבשה תוך יומיים. המאמן העריך את זה יותר ממה שהודה."; } },
    { label: "להכחיש הכל", hint: "הימור", apply: g => g.denyScandal() },
    { label: "לתרום את שכר השבוע ולא לומר מילה", hint: "עולה כסף",
      apply: g => { g.spend(g.me.contract.wage); fan(g, 9); rep(g, 2);
        return "העברת את שכר השבוע למועדון ילדים בשכונה. מישהו הדליף את זה. האוהדים אימצו אותך."; } },
  ],
});

ev({
  eid: "national_call", title: "המעטפה מהנבחרת", stages: ["player", "veteran"], weight: 5.0, once: true,
  cond: g => g.me.reputation >= 52 && !g.flag("national_debut"),
  body: () => "סגל הנבחרת פורסם. השם שלך שם, בשורה התחתונה, מודפס קטן.\n" +
    "אמא שלך שלחה צילום מסך עם אחת עשרה נקודות קריאה.",
  choices: [
    { label: "לנסוע ולתת הכל", hint: "מוניטין ↑↑", apply: g => g.nationalDebut() },
    { label: "להתנצל — הגוף צריך מנוחה",
      apply: g => { rep(g, -5); g.me.fitness = 100; mor(g, -3);
        return "ויתרת על הקריאה הראשונה. הסלקטור לא שכח."; } },
  ],
});

ev({
  eid: "big_club_interest", title: "שיחה מאירופה", stages: ["player", "veteran"], weight: 4.5, once: false,
  cond: g => g.bigClubSuitor() !== null && [11, 12, 13].includes(g.week),
  body: g => `הסוכן שלך מתקשר בשתיים בלילה.\n` +
    `"${g.bigClubSuitor().name} שאלו עליך. לא סתם שאלו — הם שלחו צופה לשלושה משחקים.\n` +
    `תגיד לי עכשיו: אם תגיע הצעה, אתה בפנים?"`,
  choices: [
    { label: "תגיד להם שאני מוכן", hint: "מגדיל סיכוי להצעה",
      apply: g => { g.setFlag("open_to_europe", true); mor(g, 5);
        return "המילה עברה. עכשיו כל משחק הוא מבחן קבלה."; } },
    { label: "אני מרוכז במועדון שלי",
      apply: g => { tru(g, 8); fan(g, 7); mor(g, 2);
        return "הצהרת נאמנות. המועדון הרים לך את השכר בלי שביקשת."; } },
  ],
});

ev({
  eid: "captain_armband", title: "הסרט", stages: ["player", "veteran"], weight: 4.0, once: true,
  cond: g => g.me.age >= 25 && g.myClub() && g.myClub().managerTrust >= 65,
  body: g => `${g.myClub().managerName} סוגר את הדלת.\n` +
    `"הקפטן הולך בסוף העונה. אני רוצה שאתה תיקח את הסרט.\n` +
    `זה אומר גם את הפעמים שצריך לצעוק על מישהו שאתה אוהב."`,
  choices: [
    { label: "לקחת את הסרט", hint: "מנהיגות, אחריות, לחץ", apply: g => g.becomeCaptain() },
    { label: "להציע במקומי את הוותיק",
      apply: g => { tru(g, 3); mor(g, 2);
        return "ויתרת לטובת מישהו אחר. חדר ההלבשה זכר לך את זה שנים."; } },
  ],
});

ev({
  eid: "serious_injury", title: "הרגל נתקעה בדשא", stages: ["player", "veteran"], weight: 3.0, once: false,
  cond: g => g.me.injuryWeeks >= 8,
  body: g => `${g.me.injuryName}. ${g.me.injuryWeeks} שבועות, אם הכל ילך טוב.\n` +
    `הרופא מדבר, אתה שומע רק את המילה "אם".`,
  choices: [
    { label: "שיקום לפי הספר, בלי קיצורי דרך", hint: "בטוח",
      apply: g => { att(g, "mental", 1.2); mor(g, -4); g.setFlag("clean_rehab", true);
        return "חזרת בזמן, בלי הישנות. איבדת חצי עונה והרווחת גוף שמחזיק."; } },
    { label: "לדחוף חזרה מוקדם — הקבוצה צריכה אותי", hint: "הימור מסוכן", apply: g => g.rushRehab() },
    { label: "לנצל את הזמן ללימודי אימון", hint: "פותח דלתות לעתיד", apply: g => g.studyDuringInjury() },
  ],
});

ev({
  eid: "sponsor_deal", title: "חוזה פרסום", stages: ["player", "veteran"], weight: 2.2, once: false,
  cond: g => g.me.reputation >= 45,
  body: () => "חברת נעליים שמה על השולחן חוזה שנתי.\n" +
    "הכסף מכובד. התנאי: שלושה ימי צילומים בעונה, אחד מהם בשבוע של משחק.",
  choices: [
    { label: "לחתום", hint: "₪450,000",
      apply: g => { g.earn(450000); g.me.mediaSkill = clamp(g.me.mediaSkill + 6, 0, 100); tru(g, -3);
        return "חתמת. הצטלמת. המאמן ראה את הפוסטר בכניסה למתחם ולא חייך."; } },
    { label: "לסרב — לא בשבוע של משחק",
      apply: g => { tru(g, 5); att(g, "mental", 0.5); return "סירבת. הסוכן כעס. הצוות המקצועי לא."; } },
  ],
});

ev({
  eid: "contract_talks", title: "שולחן המשא ומתן", stages: ["player", "veteran"], weight: 8.0, once: false,
  cond: g => g.me.contract.yearsLeft <= 0 && g.myClub() !== null,
  body: g => `החוזה שלך נגמר בסוף העונה.\n${g.myClub().name} הניחו הצעה על השולחן: ` +
    `₪${fmt(g.renewalOffer())} לשבוע.`,
  choices: [
    { label: "לחתום מיד", hint: "ביטחון", apply: g => g.signRenewal(1.0) },
    { label: "לדרוש יותר", hint: "הימור על היחסים", apply: g => g.demandRaise() },
    { label: "לא לחתום — לצאת חופשי בקיץ", hint: "מסוכן, אבל משתלם",
      apply: g => { g.setFlag("free_agent_soon", true); tru(g, -14); fan(g, -8);
        return "לא חתמת. בקיץ תהיה חופשי — ועד אז אתה זר במועדון שלך."; } },
  ],
});

ev({
  eid: "dressing_room_split", title: "חדר הלבשה מפוצל", stages: ["player", "veteran"], weight: 2.0, once: false,
  cond: g => g.myClub() && g.myClub().managerTrust <= 40,
  body: g => `חצי מהקבוצה רוצה ש${g.myClub().managerName} ילך.\n` +
    `מישהו כבר דיבר עם עיתונאי. עכשיו מסתכלים עליך — אתה בין הבכירים.`,
  choices: [
    { label: "לתמוך במאמן בפומבי",
      apply: g => { tru(g, 16); mor(g, -3); g.setFlag("manager_ally", true);
        return "עמדת מולו והצהרת. חלק מהחבר'ה הפסיקו לדבר איתך. המאמן לא יוריד אותך יותר לעולם."; } },
    { label: "להצטרף למרד", hint: "עלול לפוצץ את העונה", apply: g => g.joinRevolt() },
    { label: "לכנס את הקבוצה בלי המאמן", hint: "מנהיגות",
      apply: g => { att(g, "mental", 1.5); mor(g, 5); g.setFlag("leader_moment", true);
        return "כינסת את כולם. שעה של אמת בלי צוות מקצועי. מאותו יום אתה המנהיג של החדר."; } },
  ],
});

ev({
  eid: "youngster_threat", title: "הילד שהגיע לתפוס את המקום", stages: ["player", "veteran"], weight: 2.0, once: false,
  cond: g => g.me.age >= 26 && g.rivalYoungster() !== null,
  body: g => {
    const kid = g.rivalYoungster();
    return `${kid.name}, בן ${kid.age}, נכנס לקבוצה.\n` +
      `אותה עמדה. אותן רגליים שהיו לך פעם. הצוות מדבר עליו בהתלהבות שכבר לא מדברים עליך.`;
  },
  choices: [
    { label: "לקחת אותו תחת חסותך", hint: "פותח דלת לאימון בעתיד", apply: g => g.mentorYoungster() },
    { label: "להילחם בו על כל דקה",
      apply: g => { att(g, "physical", 1.2); mor(g, -3); tru(g, 4);
        return "הפכת כל אימון לקרב. שנית בחזרה את הכיסא — לעונה אחת לפחות."; } },
    { label: "לבקש מהמאמן לשחק במקום אחר במגרש", hint: "מאריך קריירה", apply: g => g.changePosition() },
  ],
});

ev({
  eid: "body_signals", title: "הגוף מדבר", stages: ["veteran"], weight: 3.0, once: false,
  cond: g => g.me.age >= 32,
  body: g => `אתה בן ${g.me.age}. הבוקר לקח לך עשרים דקות לרדת מהמיטה.\n` +
    `הפיזיותרפיסט אומר שאפשר להמשיך — עם מחיר.`,
  choices: [
    { label: "להוריד עומסים ולשחק חכם",
      apply: g => { att(g, "mental", 1.4); att(g, "pace", -0.6); g.me.fitness = 100;
        return "התחלת לשחק בראש במקום ברגליים. פחות ספרינטים, יותר מסירות נכונות."; } },
    { label: "זריקות ולהמשיך כרגיל", hint: "מסוכן", apply: g => g.painkillers() },
    { label: "להתחיל לתכנן את היום שאחרי", hint: "מכין את הקריירה הבאה",
      apply: g => { mor(g, 2); return g.studyDuringInjury(); } },
  ],
});

ev({
  eid: "retirement_call", title: "ההחלטה", stages: ["veteran"], weight: 9.0, once: false,
  cond: g => g.retirementReady(),
  body: g => `${g.me.age}. ${g.me.career.apps + g.me.season.apps} משחקים בקריירה.\n` +
    `${g.me.career.goals + g.me.season.goals} שערים.\n` +
    `הסוכן שואל את השאלה שאתה מתחמק ממנה חודשים:\n` +
    `"עוד עונה, או שאנחנו מתחילים לדבר על מה שאחרי?"`,
  choices: [
    { label: "עוד עונה אחת. אני עוד מסוגל.",
      apply: g => { mor(g, 5); g.setFlag("one_more_year", true);
        return "עוד עונה. הגוף ישלם, אבל אתה עוד לא מוכן להוריד את הנעליים."; } },
    { label: "להכריז על פרישה בסוף העונה", hint: "פותח את הפרק הבא", apply: g => g.announceRetirement() },
  ],
});

ev({
  eid: "farewell_match", title: "משחק הפרידה", stages: ["retired"], weight: 10.0, once: true,
  cond: g => g.flag("retired_announced"),
  body: g => `${g.lastClubName()} מארגנים לך משחק פרידה.\n` +
    `האצטדיון מלא. הילדים ביציע לובשים את החולצה עם השם שלך.`,
  choices: [
    { label: "לשחק 20 דקות ולצאת לתשואות",
      apply: g => { rep(g, 6); g.recordHonour("משחק פרידה מול אצטדיון מלא"); g.earn(700000);
        return "עשרים דקות, נגיעה אחת שהזכירה לכולם למה. יצאת כשכל האצטדיון עומד."; } },
    { label: "לוותר על הטקס ולהיעלם בשקט",
      apply: g => { rep(g, -2); g.setFlag("quiet_exit", true);
        return "לא הגעת. חלק כיבדו את זה, רובם לא הבינו."; } },
  ],
});

ev({
  eid: "next_chapter", title: "הפרק הבא", stages: ["retired"], weight: 12.0, once: true,
  cond: () => true,
  body: g => `עברו שלושה חודשים מאז המשחק האחרון.\n` +
    `הטלפון עדיין מצלצל — אבל עכשיו מציעים לך דברים אחרים.\n\n${g.careerOptionsSummary()}`,
  choices: [
    { label: "מסלול אימון — מאמן עוזר במועדון", hint: "דורש תעודות אימון", apply: g => g.startCoaching() },
    { label: "אולפן — פרשן טלוויזיה", hint: "דורש כריזמה תקשורתית", apply: g => g.startPunditry() },
    { label: "סוכנות שחקנים", hint: "דורש ראש עסקי", apply: g => g.startAgency() },
    { label: "לקחת שנה חופש",
      apply: g => { g.setFlag("gap_year", true); mor(g, 8);
        return "שנה של כלום. משפחה, ים, שינה. כשחזרת, הטלפון עדיין צלצל."; } },
  ],
});

ev({
  eid: "first_manager_offer", title: "הצעה לשבת בכיסא הגדול", stages: ["coach"], weight: 8.0, once: true,
  cond: g => g.me.coaching >= 45,
  body: g => `${g.managerJobOfferName()} מחפשים מנג'ר.\n` +
    `הם רוצים מישהו שמכיר את המועדון מבפנים. הם רוצים אותך.\n` +
    `התנאי: אתה לוקח את זה עכשיו, באמצע משבר.`,
  choices: [
    { label: "לקחת את התפקיד", hint: "הופך אותך למנג'ר ראשי", apply: g => g.takeManagerJob() },
    { label: "עוד שנה כעוזר, ללמוד עוד",
      apply: g => { g.me.coaching = clamp(g.me.coaching + 10, 0, 100);
        return "נשארת ללמוד. ידע האימון שלך קפץ — וההצעה הבאה תהיה טובה יותר."; } },
  ],
});

ev({
  eid: "board_meeting", title: "ישיבת הנהלה", stages: ["manager"], weight: 4.0, once: false,
  cond: g => [6, 13, 20].includes(g.week) && g.myClub() !== null,
  body: g => `היו"ר פורש טבלה על השולחן.\n` +
    `"ציפינו ל${g.myClub().seasonExpectation}. אנחנו במקום ${g.leaguePosition()}.\n` +
    `תסביר לי מה קורה — ובלי סיסמאות."`,
  choices: [
    { label: "לקחת אחריות מלאה",
      apply: g => { g.board(6); return "לקחת הכל על עצמך. ההנהלה נתנה לך עוד זמן."; } },
    { label: "לדרוש תקציב להעברות", hint: "הימור על היחסים", apply: g => g.demandBudget() },
    { label: "להאשים את השופטים ואת הפציעות",
      apply: g => { g.board(-9); fan(g, 4);
        return "האוהדים אהבו את זה. ההנהלה ספרה את המילים ולא התרשמה."; } },
  ],
});

ev({
  eid: "star_wants_out", title: "הכוכב רוצה ללכת", stages: ["manager"], weight: 3.0, once: false,
  cond: g => g.squadStar() !== null,
  body: g => {
    const s = g.squadStar();
    return `${s.name} (${overall(s)}) נכנס למשרד עם הסוכן.\n"יש הצעה מבחוץ. אני רוצה שתשחרר אותי."`;
  },
  choices: [
    { label: "למכור ולהשקיע בסגל", hint: "תקציב ↑, איכות ↓", apply: g => g.sellStar() },
    { label: "לסרב ולהחזיק אותו בכוח", hint: "מורל הקבוצה בסיכון", apply: g => g.keepStar() },
    { label: "להציע לו את הקפטן והעלאה", hint: "עולה כסף", apply: g => g.promoteStar() },
  ],
});

ev({
  eid: "wonderkid", title: "ילד מהנוער", stages: ["manager"], weight: 3.0, once: false,
  cond: g => g.myClub() !== null,

function eligibleEvents(g) {
  return STORY.filter(e => {
    if (e.stages.length && !e.stages.includes(g.stage)) return false;
    if (e.once && g.firedEvents.includes(e.eid)) return false;
    try { return !!e.cond(g); } catch (err) { return false; }
  });
}

function pickEvent(g, rng, chance = 0.34) {
  const candidates = eligibleEvents(g);
  if (!candidates.length) return null;
  const forced = candidates.filter(e => e.weight >= 8.0);
  if (!forced.length && rng.random() > chance) return null;
  const pool = forced.length ? forced : candidates;
  return rng.weighted(pool.map(e => [e, e.weight]));
}

function findEvent(eid) { return STORY.find(e => e.eid === eid) || null; }
