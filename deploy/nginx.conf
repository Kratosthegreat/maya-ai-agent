# הגשה של קובץ אחד. שני דברים כאן לא מובנים מאליהם:
#
# gzip — הקובץ הוא מגה וחצי של טקסט, ונדחס לכשליש. בלי זה הטעינה
# הראשונה בטלפון על וויפיי חלש מורגשת.
#
# no-cache על ה-HTML — כשתעדכן את הקובץ, הדפדפן צריך לקחת את החדש
# ולא את מה ששמור אצלו. השמורה של הקריירה לא מושפעת מזה: היא יושבת
# ב-localStorage של הדפדפן, לא במטמון של הדף.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # חגורה ושלייקס: לקובץ עצמו יש כבר הצהרת קידוד, וזאת הכותרת
    charset utf-8;

    gzip on;
    gzip_types text/html;
    gzip_min_length 1024;

    location / {
        index index.html;
        add_header Cache-Control "no-cache";
    }
}
